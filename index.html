<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    
    <!-- Adicionando o Manifesto -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Corrigir caminho para o CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Adicionando o ícone para PWA -->
    <link rel="icon" href="icons/icon-192x192.png">
    
    <!-- Iniciando o Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
                console.log('Service Worker registrado com sucesso:', registration);
            }).catch(function(error) {
                console.log('Falha ao registrar Service Worker:', error);
            });
        }
    </script>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 Lista de Compras</h1>
        </header>

        <div class="input-section">
            <input type="text" id="item" placeholder="Digite o item" class="input">
            <input type="number" id="quantidade" placeholder="Quantidade" class="input">
            <input type="number" id="valor" placeholder="Valor Unitário (R$)" class="input">
            <button id="adicionar" class="btn">Adicionar Item</button>
        </div>

        <div class="list">
            <h2>Itens na Lista:</h2>
            <ul id="itens-lista"></ul>
        </div>

        <div class="footer">
            <p>Total: <span id="total">R$ 0,00</span></p>
            <button id="limpar" class="btn">Limpar Lista</button>
        </div>
    </div>

    <!-- Corrigir caminho para o JS -->
    <script src="script.js" defer></script>
</body>
</html>
