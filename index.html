<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compras</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Meta tags para transformar em aplicativo mobile -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4CAF50">
</head>
<body>

    <div class="container">
        <header>
            <h1>🛒 Lista de Compras</h1>
        </header>

        <div class="input-section">
            <input type="text" id="item" placeholder="Digite o item" class="input">
            <input type="number" id="quantidade" placeholder="Quantidade" class="input">
            <input type="number" id="valor" placeholder="Valor Unitário (R$)" class="input">
            <button id="adicionar" class="btn">Adicionar Item</button>
        </div>

        <div class="list">
            <h2>Itens na Lista:</h2>
            <ul id="itens-lista"></ul>
        </div>

        <div class="footer">
            <p>Total: <span id="total">R$ 0,00</span></p>
            <button id="limpar" class="btn">Limpar Lista</button>
            <!-- Botão Exportar é inserido dinamicamente pelo JS -->
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
